<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous" onerror="window.__handsScriptError=true"></script>
<style>
  :root {
    --lime:#ff3b4f; --bg:#080a0d; --panel:rgba(17,22,24,.88);
    --muted:#98a3a5; --line:rgba(255,59,79,.24); --glass:rgba(255,255,255,.055);
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:radial-gradient(ellipse at 50% -15%, #2b171c 0%, #0b1010 42%, var(--bg) 78%);
    color:#f4f7f2; font-family:'JetBrains Mono',ui-monospace,monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:34px 18px;
  }
  h1 { color:var(--lime); font-size:clamp(22px,3vw,30px); letter-spacing:.16em; text-transform:uppercase; text-shadow:0 0 24px #ff3b4f30; }
  .sub { color:var(--muted); font-size:11px; letter-spacing:.04em; margin:9px 0 24px; text-align:center; }
  #stage {
    position:relative; width:min(1100px,100%); aspect-ratio:16/9; border-radius:18px;
    overflow:hidden; background:#101517; border:1px solid rgba(255,59,79,.28);
    box-shadow:0 24px 80px #0009, 0 0 35px #ff3b4f12;
  }
  canvas { width:100%; height:100%; display:block; }
  video { display:none; }
  .pill {
    position:absolute; background:rgba(8,13,14,.82); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.13); border-radius:999px; font-size:10px;
    padding:9px 14px; color:#f4f7f2; cursor:pointer; font-family:inherit;
    letter-spacing:.06em; transition:background .2s,border-color .2s,transform .2s;
  }
  .pill:hover { border-color:var(--lime); background:#30171d; transform:translateY(-1px); }
  #lbBtn { top:16px; left:16px; }
  #lbBtn b { color:var(--lime); margin-right:7px; }
  #timer { top:16px; left:50%; transform:translateX(-50%); display:none; font-weight:700; color:var(--lime); }
  #resetBtn { bottom:16px; left:16px; width:36px; height:36px; padding:0; font-size:17px; }
  #hint {
    position:absolute; top:16px; right:16px; background:rgba(8,13,14,.82);
    backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:11px 14px; font-size:9px; line-height:1.85;
    text-align:right; max-width:240px; color:#d5ddda;
  }
  #hint .ph { color:var(--lime); font-weight:700; letter-spacing:.1em; margin-bottom:3px; }
  #status { position:absolute; bottom:20px; right:18px; font-size:9px; color:#ffffffb8; letter-spacing:.05em; }
  #done, #lb {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.68); backdrop-filter:blur(8px); padding:16px;
  }
  #done .card, #lb .card {
    text-align:center; background:linear-gradient(145deg,rgba(23,31,27,.98),rgba(10,15,16,.98));
    border:1px solid var(--line); box-shadow:0 20px 60px #0009;
    padding:28px 30px; border-radius:18px; min-width:min(320px,100%);
  }
  #done .big { color:var(--lime); font-size:23px; font-weight:700; letter-spacing:.12em; }
  #done .time { font-size:30px; margin:12px 0 7px; }
  #done .saved { color:var(--muted); font-size:10px; margin-bottom:20px; }
  #done button, #lb button {
    background:var(--lime); color:#101510; border:0; border-radius:8px;
    padding:10px 15px; font-family:inherit; font-size:10px; font-weight:700;
    letter-spacing:.06em; cursor:pointer; transition:filter .2s,transform .2s;
  }
  #done button:hover, #lb button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .score-form { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .score-form input {
    width:190px; min-width:0; background:rgba(255,255,255,.07); color:#fff;
    border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:10px 12px;
    font:inherit; font-size:11px; outline:none;
  }
  .score-form input:focus { border-color:var(--lime); box-shadow:0 0 0 2px rgba(255,59,79,.16); }
  .score-form input::placeholder { color:#899294; }
  #lb .card { min-width:min(360px,100%); max-height:84%; overflow:auto; text-align:left; }
  #lb h2 { color:var(--lime); font-size:14px; letter-spacing:.12em; margin-bottom:15px; text-align:center; }
  #lb ol { padding-left:25px; font-size:11px; line-height:2.5; color:#e8eeea; }
  #lb ol span { float:right; margin-left:25px; color:var(--lime); }
  #lb .actions { display:flex; justify-content:center; gap:9px; margin-top:18px; }
  #lb button.secondary { background:var(--glass); color:#eaf0eb; border:1px solid #ffffff26; }
  #lb button.danger { background:#ff6262; color:#210909; }
  #msg {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; background:#070a0dee; color:#dce6df; font-size:12px;
    letter-spacing:.04em; padding:30px;
  }
  #sizes { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:7px; }
  #sizes .pill { position:static; padding:8px 12px; }
  #sizes .pill.on { background:var(--lime); color:#101510; border-color:var(--lime); font-weight:700; }
  @media (max-width:600px) {
    body { padding:22px 10px; }
    #stage { border-radius:12px; }
    #hint { top:58px; right:10px; padding:7px 9px; font-size:8px; max-width:175px; }
    #lbBtn { top:10px; left:10px; }
    #timer { top:12px; }
    #resetBtn { bottom:10px; left:10px; }
    #sizes { bottom:10px; }
    #sizes .pill { padding:7px 9px; font-size:9px; }
    #status { bottom:17px; right:10px; font-size:8px; }
  }
</style>
</head>
<body>
<h1>Live Puzzle</h1>
<div class="sub">Frame it to Snap. Pinch &amp; Drag to Swap.</div>

<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="cv" width="1280" height="720"></canvas>

  <button class="pill" id="lbBtn"><b>&#9776;</b>LEADERBOARD</button>
  <div class="pill" id="timer">0:00</div>
  <div id="hint"></div>
  <button class="pill" id="resetBtn" title="Reset">&#8635;</button>
  <div id="status"></div>

  <div id="sizes"></div>

  <div id="done"><div class="card">
    <div class="big">PUZZLE SOLVED!</div>
    <div class="time" id="doneTime">0:00</div>
    <div class="saved">ENTER PLAYER NAME TO SAVE YOUR SCORE</div>
    <form id="scoreForm" class="score-form">
      <input id="playerName" type="text" maxlength="16" value="MUGIL" placeholder="ENTER NAME" autocomplete="off" aria-label="Player name">
      <button type="submit">SAVE SCORE</button>
    </form>
  </div></div>

  <div id="lb"><div class="card">
    <h2 id="lbTitle">LEADERBOARD</h2><ol id="lbList"></ol>
    <div class="actions">
      <button class="danger" id="eraseLbBtn">ERASE SCORES</button>
      <button class="secondary close">CLOSE</button>
    </div>
  </div></div>

  <div id="msg">Starting camera and hand tracking...</div>
</div>

<script>
const W = 1280, H = 720;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const cam = document.getElementById('cam');
const $ = id => document.getElementById(id);
const LIME = '#c6ff2e';

// mirrored video frame lives here so we can crop clean snapshots from it
const vcan = document.createElement('canvas'); vcan.width = W; vcan.height = H;
const vctx = vcan.getContext('2d');

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// ---------- game state ----------
let N = 3;
const SIZES = [3, 4, 6];
function buildSizes() {
  const box = $('sizes'); box.innerHTML = '';
  SIZES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill' + (s === N ? ' on' : '');
    b.textContent = s + 'x' + s;
    b.onclick = () => { N = s; reset(); buildSizes(); };
    box.appendChild(b);
  });
}

let returnToCameraAfterLeaderboard = false;
let phase = 'capture';           // capture | play | done
let snap = null, grid = null;    // snapshot canvas, {x,y,w,h}
let tiles = [];                  // tiles[pos] = original index
let drag = null;                 // {pos, val}
let startTime = 0, elapsed = 0;
let capHold = 0, lostFrames = 0;
const pinchState = [false, false];
let ptr = { x: 0, y: 0 };

const hints = {
  capture: ['PHASE 1: CAPTURE', '1. Form a frame with two hands', '2. Pinch both hands to SNAP'],
  play:    ['PHASE 2: SOLVE',   '1. Pinch to pick up a tile', '2. Drag it over another tile', '3. Release to SWAP']
};
function setHint(p) {
  const h = hints[p];
  $('hint').innerHTML = `<div class="ph">${h[0]}</div>` + h.slice(1).join('<br>');
}

// ---------- helpers ----------
const pt = (lm, i) => ({ x: (1 - lm[i].x) * W, y: lm[i].y * H });   // mirrored pixel coords
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function pinchInfo(lm, idx) {
  const t = pt(lm, 4), i = pt(lm, 8);
  const size = dist(pt(lm, 0), pt(lm, 9)) || 1;
  const ratio = dist(t, i) / size;
  // hysteresis so the pinch does not flicker
  if (pinchState[idx]) { if (ratio > 0.5) pinchState[idx] = false; }
  else if (ratio < 0.3) pinchState[idx] = true;
  return { pinching: pinchState[idx], x: (t.x + i.x) / 2, y: (t.y + i.y) / 2 };
}

function fmt(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); }

function shuffle() {
  let a;
  do {
    a = [...Array(N * N).keys()];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  } while (a.every((v, i) => v === i));
  return a;
}

function cellAt(x, y) {
  if (!grid || x < grid.x || y < grid.y || x >= grid.x + grid.w || y >= grid.y + grid.h) return -1;
  const c = Math.floor((x - grid.x) / (grid.w / N)), r = Math.floor((y - grid.y) / (grid.h / N));
  return r * N + c;
}

function drawTile(val, x, y, w, h) {
  const sw = grid.w / N, sh = grid.h / N;
  ctx.drawImage(snap, (val % N) * sw, Math.floor(val / N) * sh, sw, sh, x, y, w, h);
}

function drawHand(lm) {
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const [a, b] of BONES) { const p = pt(lm, a), q = pt(lm, b); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); }
  ctx.stroke();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 21; i++) { const p = pt(lm, i); ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); }
}

function label(text, x, y) {
  ctx.font = '700 15px JetBrains Mono, monospace'; ctx.fillStyle = LIME; ctx.textBaseline = 'bottom';
  ctx.fillText(text, x, y);
}

// ---------- per frame ----------
function onResults(res) {
  $('msg').style.display = 'none';

  // mirrored camera frame
  vctx.save(); vctx.translate(W, 0); vctx.scale(-1, 1); vctx.drawImage(res.image, 0, 0, W, H); vctx.restore();
  ctx.drawImage(vcan, 0, 0);

  const hands = res.multiHandLandmarks || [];
  const infos = hands.map((lm, i) => pinchInfo(lm, i));
  for (let i = hands.length; i < 2; i++) pinchState[i] = false;

  if (phase === 'capture') captureStep(hands, infos);
  else if (phase === 'play') playStep(hands, infos);
  else drawPuzzle();

  hands.forEach(drawHand);
  $('status').textContent = hands.length + (hands.length === 1 ? ' hand' : ' hands') + ' detected';
}

function captureStep(hands, infos) {
  if (hands.length < 2) { capHold = 0; label('SHOW BOTH HANDS', 30, H - 24); return; }
  const a = infos[0], b = infos[1];
  const r = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  const ok = r.w > 240 && r.h > 160;

  ctx.strokeStyle = ok ? LIME : '#ff5d5d'; ctx.lineWidth = 3;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  label(!ok ? 'MAKE THE FRAME BIGGER' : (a.pinching && b.pinching ? 'HOLD...' : 'PINCH TO CAPTURE'), r.x, r.y - 6);

  if (ok && a.pinching && b.pinching) {
    capHold++;
    ctx.fillStyle = 'rgba(255,59,79,' + Math.min(0.35, capHold / 20) + ')';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (capHold >= 6) startPuzzle(r);
  } else capHold = 0;
}

function startPuzzle(r) {
  grid = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w / N) * N, h: Math.round(r.h / N) * N };
  snap = document.createElement('canvas'); snap.width = grid.w; snap.height = grid.h;
  snap.getContext('2d').drawImage(vcan, grid.x, grid.y, grid.w, grid.h, 0, 0, grid.w, grid.h);
  tiles = shuffle(); drag = null; capHold = 0;
  phase = 'play'; startTime = performance.now(); elapsed = 0;
  setHint('play'); $('timer').style.display = 'block';
}

function playStep(hands, infos) {
  elapsed = (performance.now() - startTime) / 1000;
  $('timer').textContent = '\u23F1 ' + fmt(elapsed);

  // use the first hand that is pinching, otherwise the first hand
  const h = infos.find(i => i.pinching) || infos[0];
  if (h) {
    lostFrames = 0;
    ptr.x += (h.x - ptr.x) * 0.5; ptr.y += (h.y - ptr.y) * 0.5;   // light smoothing
    if (!drag && h.pinching) {
      const c = cellAt(ptr.x, ptr.y);
      if (c >= 0) drag = { pos: c, val: tiles[c] };
    } else if (drag && !h.pinching) {
      const c = cellAt(ptr.x, ptr.y);
      if (c >= 0 && c !== drag.pos) [tiles[c], tiles[drag.pos]] = [tiles[drag.pos], tiles[c]];
      drag = null;
      if (tiles.every((v, i) => v === i)) return finish();
    }
  } else if (++lostFrames > 12) drag = null;

  drawPuzzle(h ? cellAt(ptr.x, ptr.y) : -1);
}

function drawPuzzle(hover = -1) {
  if (!grid) return;
  const tw = grid.w / N, th = grid.h / N;
  ctx.fillStyle = '#0a0a10'; ctx.fillRect(grid.x, grid.y, grid.w, grid.h);
  for (let p = 0; p < N * N; p++) {
    if (drag && p === drag.pos) continue;              // leave a hole where the held tile came from
    drawTile(tiles[p], grid.x + (p % N) * tw, grid.y + Math.floor(p / N) * th, tw, th);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(grid.x + i * tw, grid.y); ctx.lineTo(grid.x + i * tw, grid.y + grid.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(grid.x, grid.y + i * th); ctx.lineTo(grid.x + grid.w, grid.y + i * th); ctx.stroke();
  }
  if (hover >= 0 && !drag) {
    ctx.strokeStyle = LIME; ctx.lineWidth = 2;
    ctx.strokeRect(grid.x + (hover % N) * tw, grid.y + Math.floor(hover / N) * th, tw, th);
  }
  if (drag) {
    const x = ptr.x - tw / 2, y = ptr.y - th / 2;
    drawTile(drag.val, x, y, tw, th);
    ctx.strokeStyle = LIME; ctx.lineWidth = 3; ctx.strokeRect(x, y, tw, th);
    ctx.fillStyle = LIME; ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 6, 0, 7); ctx.fill();
  }
}

// ---------- finish, leaderboard, reset ----------
function finish() {
  if (phase === 'done') return;
  phase = 'done'; drag = null;
  $('doneTime').textContent = '\u23F1 ' + fmt(elapsed);
  $('playerName').value = 'MUGIL';
  $('done').style.display = 'flex';
  $('playerName').focus();
  $('playerName').select();
  drawPuzzle();
}

const key = () => 'livepuzzle_' + N;
const loadScores = () => { try { return JSON.parse(localStorage.getItem(key()) || '[]'); } catch { return []; } };
function saveScore(name, t) {
  const s = loadScores(); s.push({ name, t }); s.sort((a, b) => a.t - b.t);
  try { localStorage.setItem(key(), JSON.stringify(s.slice(0, 10))); } catch {}
}
function renderLb() {
  $('lbTitle').textContent = 'LEADERBOARD ' + N + 'x' + N;
  const s = loadScores();
  $('lbList').innerHTML = s.length
    ? s.map(e => `<li>${e.name.replace(/[<>&]/g, '')}<span>${fmt(e.t)}</span></li>`).join('')
    : '<li style="list-style:none;color:#8d8d99">No times yet</li>';
}
function reset() {
  phase = 'capture'; snap = grid = null; drag = null; capHold = 0;
  $('done').style.display = 'none'; $('timer').style.display = 'none';
  setHint('capture');
}

$('scoreForm').onsubmit = e => {
  e.preventDefault();
  const playerName = $('playerName').value.trim().slice(0, 16) || 'MUGIL';
  saveScore(playerName, elapsed);
  $('done').style.display = 'none';
  returnToCameraAfterLeaderboard = true;
  renderLb();
  $('lb').style.display = 'flex';
};
$('lbBtn').onclick = () => { renderLb(); $('lb').style.display = 'flex'; };
$('lb').querySelector('.close').onclick = () => {
  $('lb').style.display = 'none';
  if (returnToCameraAfterLeaderboard) {
    returnToCameraAfterLeaderboard = false;
    reset(); // clear the completed puzzle and return to live camera capture
  }
};
$('eraseLbBtn').onclick = () => {
  if (!confirm('Erase all leaderboard scores for ' + N + 'x' + N + '? This cannot be undone.')) return;
  try { localStorage.removeItem(key()); } catch {}
  renderLb();
};
$('resetBtn').onclick = reset;

// ---------- boot + clear diagnostics ----------
function showStartupError(message) {
  $('msg').style.display = 'flex';
  $('msg').textContent = message;
  $('status').textContent = 'STARTUP ERROR';
  console.error(message);
}

function waitForVideo(timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    if (cam.readyState >= 2 && cam.videoWidth > 0) return resolve();
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('Camera connected, but no video frames arrived. Close other apps using the camera and try again.'));
    }, timeoutMs);
    const done = () => {
      if (cam.videoWidth > 0) {
        cleanup();
        resolve();
      }
    };
    const cleanup = () => {
      clearTimeout(timer);
      cam.removeEventListener('loadeddata', done);
      cam.removeEventListener('playing', done);
    };
    cam.addEventListener('loadeddata', done);
    cam.addEventListener('playing', done);
  });
}

async function boot() {
  buildSizes();
  setHint('capture');

  // Camera access requires a supported browser and a secure context.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showStartupError('Camera API is unavailable. Open this game using http://localhost (recommended), not by double-clicking the HTML file. See the instructions below.');
    return;
  }

  try {
    $('msg').textContent = 'Requesting camera access...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false
    });
    cam.srcObject = stream;
    cam.muted = true;
    cam.playsInline = true;
    await cam.play();
    await waitForVideo();
  } catch (e) {
    let reason = e && e.name ? e.name + ': ' + e.message : String(e);
    if (e && e.name === 'NotAllowedError') {
      reason = 'Camera permission was denied. Click the site icon beside the address bar, set Camera to Allow, then reload.';
    } else if (e && (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError')) {
      reason = 'No camera was found. Connect or enable a webcam, then reload.';
    } else if (e && (e.name === 'NotReadableError' || e.name === 'TrackStartError')) {
      reason = 'The camera is busy or blocked by another app. Close Camera, Teams, Zoom or other apps using it, then reload.';
    }
    showStartupError('CAMERA ERROR — ' + reason);
    return;
  }

  try {
    if (window.__handsScriptError || typeof Hands === 'undefined') {
      throw new Error('MediaPipe Hands could not load. Check your internet connection or allow cdn.jsdelivr.net, then reload.');
    }

    $('msg').textContent = 'Camera ready. Loading hand tracking...';
    const hands = new Hands({
      locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);
    await hands.initialize();

    $('msg').textContent = 'Hand tracking ready. Show both hands to the camera.';
    const loop = async () => {
      if (cam.readyState >= 2 && cam.videoWidth > 0) {
        try {
          await hands.send({ image: cam });
        } catch (e) {
          console.error('Hand tracking frame error:', e);
          showStartupError('HAND TRACKING ERROR — ' + (e.message || e));
          return;
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    showStartupError('HAND TRACKING COULD NOT START — ' + (e.message || e) +
      ' Make sure the internet connection is active, then refresh the page.');
  }
}
boot();
</script>
</body>
</html>
